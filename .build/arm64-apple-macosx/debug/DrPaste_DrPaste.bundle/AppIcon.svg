<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!--
    DrPaste placeholder icon.
    "Dr" = scholar / educated / PhD (NOT medical).
    Concept: clipboard with a mortarboard (academic cap) sitting on top —
    "the educated Paste". The cap reads as the diagnostic intelligence
    of the product: context-aware actions, layout repair, smart transformations.
    Replace this file with a polished version when ready;
    AppBrand.icon picks it up automatically.
  -->
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#5B7EE0"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3B5C"/>
      <stop offset="1" stop-color="#1A2540"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4A78"/>
      <stop offset="1" stop-color="#1F2940"/>
    </linearGradient>
  </defs>

  <!-- clipboard body -->
  <rect x="22" y="40" width="84" height="80" rx="14" ry="14" fill="url(#cardGrad)"/>

  <!-- inner sheet -->
  <rect x="32" y="54" width="64" height="56" rx="6" ry="6" fill="#FFFFFF" opacity="0.94"/>

  <!-- subtle text lines on the sheet -->
  <rect x="40" y="64" width="34" height="3" rx="1.5" fill="#5B7EE0" opacity="0.55"/>
  <rect x="40" y="72" width="46" height="3" rx="1.5" fill="#5B7EE0" opacity="0.4"/>
  <rect x="40" y="80" width="30" height="3" rx="1.5" fill="#5B7EE0" opacity="0.4"/>
  <rect x="40" y="88" width="40" height="3" rx="1.5" fill="#5B7EE0" opacity="0.3"/>
  <rect x="40" y="96" width="22" height="3" rx="1.5" fill="#5B7EE0" opacity="0.3"/>

  <!-- mortarboard (academic cap) on top of clipboard -->
  <!-- crown / head band -->
  <ellipse cx="64" cy="38" rx="14" ry="5" fill="url(#capGrad)"/>
  <!-- square board (the flat top of the mortarboard) -->
  <polygon points="36,30 92,30 100,36 64,42 28,36" fill="url(#boardGrad)"/>
  <!-- highlight on the board -->
  <polygon points="36,30 92,30 88,32 40,32" fill="#FFFFFF" opacity="0.12"/>
  <!-- button (the centre stud) -->
  <circle cx="64" cy="33" r="2.2" fill="#FFD86B"/>
  <!-- tassel cord -->
  <path d="M64 33 Q 78 36 88 36 L 88 50" stroke="#FFD86B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- tassel fringe -->
  <line x1="86" y1="50" x2="86" y2="56" stroke="#FFD86B" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="88" y1="50" x2="88" y2="57" stroke="#FFD86B" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="90" y2="56" stroke="#FFD86B" stroke-width="1.4" stroke-linecap="round"/>
</svg>
